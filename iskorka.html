<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Искорка — ночной полёт</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; border-radius: 8px; box-shadow: 0 0 40px rgba(120, 100, 255, .25); cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

// ---------- Базовая настройка ----------
const W = 400, H = 700, GROUND_H = 90, FLOOR = H - GROUND_H;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
  canvas.width = Math.floor(W * scale * dpr);
  canvas.height = Math.floor(H * scale * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
addEventListener('resize', resize);
resize();

const CFG = {
  gravity: 1700,      // px/s²
  flapV: -500,        // скорость после взмаха
  maxFall: 820,
  pipeW: 72,
  gapStart: 180, gapMin: 135,
  speedStart: 150, speedMax: 240,
  spacing: 230,       // расстояние между колоннами
  birdX: 110,
  radius: 13,
};
const CAP_H = 26, CAP_OVER = 5;
const READY_Y = FLOOR / 2 - 40;
const KEY_BEST = 'iskorka-best', KEY_MUTE = 'iskorka-mute';

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// ---------- Звук (синтез через WebAudio) ----------
let actx = null;
let muted = store.get(KEY_MUTE, '0') === '1';

function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, slideTo, delay = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}
function noise(dur, vol) {
  if (!actx || muted) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = buf;
  f.type = 'lowpass'; f.frequency.value = 1200;
  g.gain.value = vol;
  src.connect(f).connect(g).connect(actx.destination);
  src.start();
}
const sfx = {
  flap: () => tone(420, 0.12, 'triangle', 0.12, 760),
  score: () => { tone(880, 0.09, 'sine', 0.12); tone(1320, 0.14, 'sine', 0.12, null, 0.08); },
  hit: () => { noise(0.25, 0.3); tone(220, 0.4, 'sawtooth', 0.08, 60); },
};
function toggleMute() { muted = !muted; store.set(KEY_MUTE, muted ? '1' : '0'); }

// ---------- Состояние ----------
let state = 'menu'; // menu | play | over
let paused = false;
let bird, pipes, particles, score, speed, newBest;
let best = parseInt(store.get(KEY_BEST, '0'), 10) || 0;
let t = 0, worldX = 0, overTime = 0, flash = 0, shake = 0, scorePop = 0, trailT = 0;

const stars = Array.from({ length: 90 }, () => ({
  x: Math.random() * W, y: Math.random() * (FLOOR - 150),
  r: Math.random() * 1.3 + 0.3, ph: Math.random() * 6.28, sp: 1 + Math.random() * 2,
}));
const specks = Array.from({ length: 14 }, () => ({
  x: Math.random() * W, y: 120 + Math.random() * (FLOOR - 200), ph: Math.random() * 6.28,
}));

function reset() {
  bird = { y: READY_Y, v: 0, rot: 0, wing: 0 };
  pipes = [];
  particles = [];
  score = 0;
  speed = CFG.speedStart;
  newBest = false;
}

function gapSize() { return Math.max(CFG.gapMin, CFG.gapStart - score * 1.5); }

function spawnPipe(x) {
  const gap = gapSize(), margin = 60;
  const minY = margin + gap / 2, maxY = FLOOR - margin - gap / 2;
  let cy = minY + Math.random() * (maxY - minY);
  const last = pipes[pipes.length - 1];
  if (last) cy = clamp(cy, last.cy - 220, last.cy + 220);
  pipes.push({ x, cy, gap, passed: false, seed: Math.random() * 1000 });
}

function startGame() {
  state = 'play';
  spawnPipe(W + 140);
  flap();
}

function flap() {
  bird.v = CFG.flapV;
  sfx.flap();
  for (let i = 0; i < 6; i++) {
    addParticle(CFG.birdX - 10, bird.y + 4, -60 - Math.random() * 80, 40 + Math.random() * 80,
      0.35 + Math.random() * 0.3, 1 + Math.random() * 2, '255,240,170', 0);
  }
}

function die(byPipe) {
  state = 'over';
  overTime = t;
  flash = 1;
  shake = 0.35;
  if (byPipe) bird.v = -160;
  sfx.hit();
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 220;
    addParticle(CFG.birdX, bird.y, Math.cos(a) * sp, Math.sin(a) * sp, 0.6 + Math.random() * 0.6,
      1.5 + Math.random() * 2.5, Math.random() < 0.5 ? '255,230,130' : '255,255,255', 260);
  }
  if (score > best) { best = score; newBest = true; store.set(KEY_BEST, String(best)); }
}

function addParticle(x, y, vx, vy, life, r, c, g) {
  if (particles.length < 400) particles.push({ x, y, vx, vy, life, max: life, r, c, g });
}

function emitTrail(dt, scroll) {
  trailT += dt;
  while (trailT > 0.035) {
    trailT -= 0.035;
    const c = Math.cos(bird.rot), s = Math.sin(bird.rot);
    const tx = CFG.birdX - 16 * c - 2 * s, ty = bird.y - 16 * s + 2 * c;
    addParticle(tx + (Math.random() - 0.5) * 4, ty + (Math.random() - 0.5) * 4,
      -scroll * 0.6 - Math.random() * 30, (Math.random() - 0.5) * 30,
      0.5 + Math.random() * 0.4, 1 + Math.random() * 1.8, '255,220,110', -10);
  }
}

function circRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

function hitPipe(p) {
  const r = CFG.radius - 1, bx = CFG.birdX, by = bird.y, w = CFG.pipeW;
  if (bx + r < p.x - CAP_OVER || bx - r > p.x + w + CAP_OVER) return false;
  const top = p.cy - p.gap / 2, bot = p.cy + p.gap / 2;
  return circRect(bx, by, r, p.x, -50, w, top - CAP_H + 50) ||
         circRect(bx, by, r, p.x - CAP_OVER, top - CAP_H, w + CAP_OVER * 2, CAP_H) ||
         circRect(bx, by, r, p.x - CAP_OVER, bot, w + CAP_OVER * 2, CAP_H) ||
         circRect(bx, by, r, p.x, bot + CAP_H, w, FLOOR - bot);
}

// ---------- Логика ----------
function update(dt) {
  t += dt;
  const scroll = state === 'play' ? speed : state === 'menu' ? CFG.speedStart * 0.6 : 0;
  worldX += scroll * dt;
  scorePop = Math.max(0, scorePop - dt * 4);
  flash = Math.max(0, flash - dt * 2.5);
  shake = Math.max(0, shake - dt);

  for (const s of specks) {
    s.x -= (scroll * 0.2 + 10) * dt;
    if (s.x < -10) { s.x = W + 10; s.y = 120 + Math.random() * (FLOOR - 200); }
  }

  if (state === 'menu') {
    bird.y = READY_Y + Math.sin(t * 3) * 10;
    bird.v = 0;
    bird.rot = Math.cos(t * 3) * 0.12;
    bird.wing += dt * 22;
    emitTrail(dt, scroll);
  } else if (state === 'play') {
    bird.v = Math.min(bird.v + CFG.gravity * dt, CFG.maxFall);
    bird.y += bird.v * dt;
    bird.wing += dt * (bird.v < 0 ? 38 : 20);
    const target = clamp(bird.v / 550, -0.45, 1.3);
    bird.rot += (target - bird.rot) * Math.min(1, dt * 12);
    if (bird.y < CFG.radius) { bird.y = CFG.radius; if (bird.v < 0) bird.v = 0; }

    for (const p of pipes) p.x -= speed * dt;
    while (pipes.length && pipes[0].x + CFG.pipeW + CAP_OVER + 10 < 0) pipes.shift();
    const lastP = pipes[pipes.length - 1];
    if (!lastP || lastP.x < W + 20 - CFG.spacing) spawnPipe(lastP ? lastP.x + CFG.spacing : W + 140);

    for (const p of pipes) {
      if (!p.passed && p.x + CFG.pipeW / 2 < CFG.birdX) {
        p.passed = true;
        score++;
        scorePop = 1;
        sfx.score();
        speed = Math.min(CFG.speedMax, CFG.speedStart + score * 3);
      }
    }
    emitTrail(dt, scroll);

    if (bird.y + CFG.radius >= FLOOR) {
      bird.y = FLOOR - CFG.radius;
      die(false);
    } else {
      for (const p of pipes) if (hitPipe(p)) { die(true); break; }
    }
  } else if (state === 'over') {
    if (bird.y + CFG.radius < FLOOR) {
      bird.v = Math.min(bird.v + CFG.gravity * dt, CFG.maxFall);
      bird.y += bird.v * dt;
      if (bird.y + CFG.radius >= FLOOR) { bird.y = FLOOR - CFG.radius; bird.v = 0; }
    }
    bird.rot += (1.35 - bird.rot) * Math.min(1, dt * 6);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

// ---------- Отрисовка ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color = '#fff', weight = 800) {
  ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size / 7);
  ctx.strokeStyle = 'rgba(10, 8, 30, 0.85)';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

const skyGrad = ctx.createLinearGradient(0, 0, 0, FLOOR);
skyGrad.addColorStop(0, '#070a24');
skyGrad.addColorStop(0.55, '#1b1a4a');
skyGrad.addColorStop(1, '#3a2a6a');

function drawSky() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-20, -20, W + 40, FLOOR + 40);

  for (const s of stars) {
    const x = (((s.x - worldX * 0.02) % W) + W) % W;
    const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    ctx.fillStyle = `rgba(255,255,240,${a.toFixed(3)})`;
    ctx.fillRect(x, s.y, s.r, s.r);
  }

  // Луна
  const mx = 335, my = 86;
  const mg = ctx.createRadialGradient(mx, my, 20, mx, my, 100);
  mg.addColorStop(0, 'rgba(255,245,200,0.35)');
  mg.addColorStop(1, 'rgba(255,245,200,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, 100, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f6efcf';
  ctx.beginPath(); ctx.arc(mx, my, 32, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(190,180,140,0.35)';
  ctx.beginPath(); ctx.arc(mx - 10, my - 8, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 9, my + 10, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 12, my - 12, 3, 0, Math.PI * 2); ctx.fill();
}

function hillY(wx, base, a1, f1, a2, f2) {
  return base - Math.sin(wx * f1) * a1 - Math.sin(wx * f2 + 1.3) * a2;
}

function drawHills() {
  // дальние холмы
  let off = worldX * 0.1;
  ctx.fillStyle = '#211c4f';
  ctx.beginPath(); ctx.moveTo(-20, FLOOR);
  for (let x = -20; x <= W + 20; x += 10) ctx.lineTo(x, hillY(x + off, 470, 40, 0.008, 18, 0.021));
  ctx.lineTo(W + 20, FLOOR); ctx.closePath(); ctx.fill();

  // ближние холмы
  off = worldX * 0.3;
  ctx.fillStyle = '#16133a';
  ctx.beginPath(); ctx.moveTo(-20, FLOOR);
  for (let x = -20; x <= W + 20; x += 10) ctx.lineTo(x, hillY(x + off, 535, 26, 0.012, 12, 0.031));
  ctx.lineTo(W + 20, FLOOR); ctx.closePath(); ctx.fill();

  // ели
  ctx.fillStyle = '#0f0d2b';
  const sp = 46;
  for (let i = Math.floor(off / sp) - 1; i <= Math.floor((off + W) / sp) + 1; i++) {
    if (rnd(i) < 0.35) continue;
    const tx = i * sp - off + rnd(i + 5) * 20;
    const gy = hillY(tx + off, 535, 26, 0.012, 12, 0.031) + 6;
    const h = 40 + rnd(i + 9) * 50, hw = h * 0.24;
    ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const ty = gy - h * (k / 3), tw = hw * (1 - k * 0.22);
      ctx.moveTo(tx - tw, ty);
      ctx.lineTo(tx, ty - h * 0.45);
      ctx.lineTo(tx + tw, ty);
    }
    ctx.fill();
    ctx.fillRect(tx - 2, gy - 2, 4, 8);
  }

  // светлячки на фоне
  for (const s of specks) {
    const y = s.y + Math.sin(t + s.ph) * 8;
    const a = 0.15 + 0.5 * (0.5 + 0.5 * Math.sin(t * 2.3 + s.ph * 3));
    ctx.fillStyle = `rgba(200,255,150,${(a * 0.25).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x, y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(230,255,180,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x, y, 1.6, 0, Math.PI * 2); ctx.fill();
  }
}

function drawPipe(p) {
  const w = CFG.pipeW;
  const top = p.cy - p.gap / 2, bot = p.cy + p.gap / 2;
  const cx0 = p.x - CAP_OVER, cw = w + CAP_OVER * 2;

  // тело колонн
  const g = ctx.createLinearGradient(p.x, 0, p.x + w, 0);
  g.addColorStop(0, '#4d5b82');
  g.addColorStop(0.3, '#6b7ba6');
  g.addColorStop(0.7, '#3e4a6e');
  g.addColorStop(1, '#272f4b');
  ctx.fillStyle = g;
  ctx.fillRect(p.x, -20, w, top - CAP_H + 20);
  ctx.fillRect(p.x, bot + CAP_H, w, FLOOR - bot - CAP_H);

  // кладка
  ctx.strokeStyle = 'rgba(15,18,40,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  let row = 0;
  for (let y = top - CAP_H; y > -26; y -= 26, row++) {
    ctx.moveTo(p.x, y); ctx.lineTo(p.x + w, y);
    const jx = p.x + (row % 2 ? w * 0.33 : w * 0.66);
    ctx.moveTo(jx, y); ctx.lineTo(jx, y - 26);
  }
  row = 0;
  for (let y = bot + CAP_H; y < FLOOR; y += 26, row++) {
    ctx.moveTo(p.x, y); ctx.lineTo(p.x + w, y);
    const jx = p.x + (row % 2 ? w * 0.33 : w * 0.66);
    ctx.moveTo(jx, y); ctx.lineTo(jx, Math.min(FLOOR, y + 26));
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(8,8,25,0.7)';
  ctx.strokeRect(p.x, -20, w, top - CAP_H + 20);
  ctx.strokeRect(p.x, bot + CAP_H, w, FLOOR - bot - CAP_H + 4);

  // капители
  const cg = ctx.createLinearGradient(cx0, 0, cx0 + cw, 0);
  cg.addColorStop(0, '#5f6f98');
  cg.addColorStop(0.3, '#8494c0');
  cg.addColorStop(0.7, '#4b5880');
  cg.addColorStop(1, '#2f3858');
  ctx.fillStyle = cg;
  ctx.strokeStyle = 'rgba(8,8,25,0.75)';
  rr(cx0, top - CAP_H, cw, CAP_H, 4); ctx.fill(); ctx.stroke();
  rr(cx0, bot, cw, CAP_H, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(cx0 + 3, top - CAP_H + 3, cw - 6, 3);
  ctx.fillRect(cx0 + 3, bot + CAP_H - 6, cw - 6, 3);

  // мох снизу верхней колонны
  ctx.fillStyle = '#3e7d4f';
  ctx.fillRect(cx0 + 2, top - 5, cw - 4, 5);
  for (let i = 0; i < 6; i++) {
    const mx = cx0 + 5 + rnd(p.seed + i) * (cw - 10), mh = 3 + rnd(p.seed + i * 3.7) * 7;
    ctx.beginPath(); ctx.ellipse(mx, top - 1 + mh / 2, 2.6, mh / 2 + 1, 0, 0, Math.PI * 2); ctx.fill();
  }
  // трава сверху нижней колонны
  ctx.fillRect(cx0 + 2, bot, cw - 4, 5);
  ctx.beginPath();
  for (let i = 0; i < 9; i++) {
    const gx = cx0 + 4 + rnd(p.seed + 20 + i) * (cw - 8), gh = 4 + rnd(p.seed + 40 + i) * 6;
    ctx.moveTo(gx - 2.5, bot + 1); ctx.lineTo(gx, bot - gh); ctx.lineTo(gx + 2.5, bot + 1);
  }
  ctx.fill();

  // светящийся грибок
  if (rnd(p.seed + 77) < 0.5) {
    const fx = cx0 + 12 + rnd(p.seed + 78) * (cw - 24), fy = bot;
    const pulse = 0.6 + 0.4 * Math.sin(t * 3 + p.seed);
    const fg = ctx.createRadialGradient(fx, fy - 7, 0, fx, fy - 7, 16);
    fg.addColorStop(0, `rgba(120,250,255,${(0.45 * pulse).toFixed(3)})`);
    fg.addColorStop(1, 'rgba(120,250,255,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(fx, fy - 7, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d8f6ff';
    ctx.fillRect(fx - 1, fy - 6, 2, 6);
    ctx.fillStyle = '#7ef9ff';
    ctx.beginPath(); ctx.arc(fx, fy - 6, 4.5, Math.PI, 0); ctx.closePath(); ctx.fill();
  }
}

function drawWing(x, y, ang, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(0, -10, 5.5, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// Персонаж — светлячок Искорка
function drawFirefly(x, y, rot, wing, dim) {
  ctx.save();
  ctx.translate(x, y);

  const gr = 44 + Math.sin(t * 5) * 4;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, gr);
  g.addColorStop(0, 'rgba(255,236,140,0.55)');
  g.addColorStop(0.45, 'rgba(255,210,90,0.16)');
  g.addColorStop(1, 'rgba(255,200,80,0)');
  ctx.globalAlpha = dim;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, gr, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.rotate(rot);
  const fa = Math.sin(wing);

  drawWing(-1, -6, -0.9 + fa * 0.55, 'rgba(170,200,255,0.35)');

  // светящееся брюшко
  const tg = ctx.createRadialGradient(-10, 2, 1, -10, 2, 11);
  tg.addColorStop(0, dim < 1 ? '#d8cf9a' : '#fffbd0');
  tg.addColorStop(0.5, dim < 1 ? '#c7a948' : '#ffe36a');
  tg.addColorStop(1, '#b8862a');
  ctx.fillStyle = tg;
  ctx.beginPath(); ctx.ellipse(-9, 2, 10, 8, -0.15, 0, Math.PI * 2); ctx.fill();

  // туловище
  ctx.fillStyle = '#4a3b78';
  ctx.beginPath(); ctx.ellipse(3, 0, 9, 8.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,120,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(-1, 0, 7.5, -1.1, 1.1); ctx.stroke();

  // голова
  ctx.fillStyle = '#2f2552';
  ctx.beginPath(); ctx.arc(11, -2, 7, 0, Math.PI * 2); ctx.fill();

  // усики
  ctx.strokeStyle = '#2f2552';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(13, -8); ctx.quadraticCurveTo(16, -16, 22, -17);
  ctx.moveTo(10, -8); ctx.quadraticCurveTo(10, -17, 15, -20);
  ctx.stroke();
  ctx.fillStyle = '#ffe36a';
  ctx.beginPath(); ctx.arc(22, -17, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(15, -20, 1.8, 0, Math.PI * 2); ctx.fill();

  // глаз
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(13.5, -3.5, 3.4, 0, Math.PI * 2); ctx.fill();
  if (dim < 1) {
    ctx.strokeStyle = '#120d24'; ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(12, -5); ctx.lineTo(15.4, -2); ctx.moveTo(15.4, -5); ctx.lineTo(12, -2);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#120d24';
    ctx.beginPath(); ctx.arc(14.6, -3.4, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(15.1, -4.1, 0.6, 0, Math.PI * 2); ctx.fill();
  }
  // щёчка
  ctx.fillStyle = 'rgba(255,140,170,0.6)';
  ctx.beginPath(); ctx.arc(12, 1.5, 1.8, 0, Math.PI * 2); ctx.fill();

  drawWing(3, -6, -0.5 + fa * 0.7, 'rgba(210,230,255,0.55)');
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.fillStyle = `rgba(${p.c},${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawGround() {
  const y = FLOOR;
  ctx.fillStyle = '#1a1430';
  ctx.fillRect(-20, y, W + 40, GROUND_H + 20);

  // камешки
  const step = 40;
  ctx.fillStyle = '#261e42';
  for (let k = Math.floor(worldX / step) - 1; k <= Math.floor((worldX + W) / step) + 1; k++) {
    const px = k * step - worldX + rnd(k) * 30, py = y + 30 + rnd(k + 3) * 48, r = 2 + rnd(k + 7) * 3;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  }

  // травяная полоса
  ctx.fillStyle = '#24563f';
  ctx.fillRect(-20, y, W + 40, 16);
  const off = worldX % 28;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  for (let x = -off - 28; x < W + 28; x += 28) {
    ctx.beginPath();
    ctx.moveTo(x, y + 3); ctx.lineTo(x + 14, y + 3); ctx.lineTo(x + 6, y + 16); ctx.lineTo(x - 8, y + 16);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#3a8a5e';
  ctx.fillRect(-20, y, W + 40, 3);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(-20, y + 16, W + 40, 3);
}

const BTN_SOUND = { x: W - 46, y: 10, w: 36, h: 36 };
const BTN_PAUSE = { x: 10, y: 10, w: 36, h: 36 };

function drawButtonBg(b) {
  rr(b.x, b.y, b.w, b.h, 8);
  ctx.fillStyle = 'rgba(20,16,50,0.6)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(180,160,255,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawSoundBtn() {
  const b = BTN_SOUND;
  drawButtonBg(b);
  const cx = b.x + 10, cy = b.y + b.h / 2;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(cx - 3, cy - 4); ctx.lineTo(cx + 2, cy - 4); ctx.lineTo(cx + 8, cy - 10);
  ctx.lineTo(cx + 8, cy + 10); ctx.lineTo(cx + 2, cy + 4); ctx.lineTo(cx - 3, cy + 4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (muted) {
    ctx.moveTo(cx + 13, cy - 5); ctx.lineTo(cx + 21, cy + 5);
    ctx.moveTo(cx + 21, cy - 5); ctx.lineTo(cx + 13, cy + 5);
    ctx.stroke();
  } else {
    ctx.arc(cx + 9, cy, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 9, cy, 11, -0.9, 0.9); ctx.stroke();
  }
}

function drawPauseBtn() {
  const b = BTN_PAUSE;
  drawButtonBg(b);
  ctx.fillStyle = '#fff';
  ctx.fillRect(b.x + 12, b.y + 10, 4, 16);
  ctx.fillRect(b.x + 20, b.y + 10, 4, 16);
}

function drawUI() {
  drawSoundBtn();

  if (state === 'play') {
    drawPauseBtn();
    text(String(score), W / 2, 80, Math.round(60 * (1 + scorePop * 0.3)));
  }

  if (state === 'menu') {
    ctx.save();
    ctx.shadowColor = 'rgba(255,215,110,0.9)';
    ctx.shadowBlur = 24;
    text('Искорка', W / 2, 150, 64, '#ffe27a', 900);
    ctx.restore();
    text('ночной полёт', W / 2, 202, 22, '#cfc6ff', 700);

    text('Пробел · клик · тап — взмах', W / 2, 360, 18, '#e8e4ff', 700);
    text('P — пауза     M — звук', W / 2, 390, 16, '#b9b0e8', 700);
    if (Math.floor(t * 2) % 2 === 0) text('Нажми, чтобы начать', W / 2, 450, 26);
    text('Рекорд: ' + best, W / 2, 520, 20, '#ffd76a');
  }

  if (state === 'over') {
    const k = clamp((t - overTime) / 0.3, 0, 1);
    const py = 180 + (1 - k) * 40;
    ctx.save();
    ctx.globalAlpha = k;
    rr(50, py, 300, 260, 18);
    ctx.fillStyle = 'rgba(20,16,50,0.9)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,160,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    text('Конец полёта', W / 2, py + 42, 34);
    text('Очки', W / 2, py + 92, 18, '#b9b0e8', 700);
    text(String(score), W / 2, py + 132, 46);
    text('Рекорд: ' + best, W / 2, py + 182, 22, '#ffd76a');
    if (newBest) {
      const s = 1 + Math.sin(t * 6) * 0.06;
      ctx.save();
      ctx.translate(W / 2, py + 224);
      ctx.scale(s, s);
      text('★ Новый рекорд! ★', 0, 0, 22, '#7ef9ff');
      ctx.restore();
    }
    ctx.restore();
    if (t - overTime > 0.7 && Math.floor(t * 2) % 2 === 0) {
      text('Нажми, чтобы сыграть ещё', W / 2, 500, 22);
    }
  }

  if (paused) {
    ctx.fillStyle = 'rgba(5,5,20,0.55)';
    ctx.fillRect(0, 0, W, H);
    text('Пауза', W / 2, H / 2 - 30, 52);
    text('Нажми, чтобы продолжить', W / 2, H / 2 + 25, 20, '#e8e4ff', 700);
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  drawSky();
  drawHills();
  for (const p of pipes) drawPipe(p);
  drawParticles();
  drawFirefly(CFG.birdX, bird.y, bird.rot, bird.wing, state === 'over' ? 0.35 : 1);
  drawGround();
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${(flash * 0.7).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawUI();
}

// ---------- Управление ----------
function press() {
  if (paused) { paused = false; return; }
  if (state === 'menu') startGame();
  else if (state === 'play') flap();
  else if (state === 'over' && t - overTime > 0.7) { reset(); state = 'menu'; }
}

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
const inBtn = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  e.preventDefault();
  initAudio();
  const p = toLogical(e);
  if (inBtn(p, BTN_SOUND)) { toggleMute(); return; }
  if (state === 'play' && !paused && inBtn(p, BTN_PAUSE)) { paused = true; return; }
  press();
}, { passive: false });

// На мобильных аудио разблокируется только по pointerup/touchend
addEventListener('pointerup', initAudio);
addEventListener('touchend', initAudio);
addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    initAudio();
    press();
  } else if (k === 'KeyP' || k === 'Escape') {
    if (state === 'play') paused = !paused;
  } else if (k === 'KeyM') {
    toggleMute();
  }
});

document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
addEventListener('blur', () => { if (state === 'play') paused = true; });

// ---------- Игровой цикл (фиксированный шаг — одинаково на 60/120/144 Гц) ----------
const STEP = 1 / 240;
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  if (!paused) {
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  }
  draw();
  requestAnimationFrame(frame);
}

reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
