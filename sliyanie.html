<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Слияние — числовая головоломка</title>
<style>
  :root {
    --board: min(92vw, 440px);
    --gap: calc(var(--board) * 0.03);
    --cell: calc((var(--board) - var(--gap) * 5) / 4);
    --bg: #0d1021;
    --panel: #171b36;
    --slot: #222849;
    --text: #e8ecff;
    --muted: #8a93c4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1c2150 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 0;
    user-select: none;
  }
  header {
    width: var(--board);
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  h1 {
    font-size: calc(var(--board) * 0.1);
    letter-spacing: 2px;
    background: linear-gradient(90deg, #5ef2ff, #b67cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .scores { display: flex; gap: 8px; }
  .score {
    background: var(--panel);
    border: 1px solid #2c335e;
    border-radius: 10px;
    padding: 6px 14px; min-width: 76px; text-align: center;
    position: relative;
  }
  .score small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .score b { font-size: 20px; }
  .plus {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    color: #5ef2ff; font-weight: bold; pointer-events: none;
    animation: rise .7s ease-out forwards;
  }
  @keyframes rise { to { top: -24px; opacity: 0; } }
  .controls {
    width: var(--board);
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; color: var(--muted); font-size: 14px;
  }
  .controls div { display: flex; gap: 8px; }
  button {
    background: linear-gradient(135deg, #3b48a8, #6a3fb8);
    color: #fff; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .4; cursor: default; filter: none; }
  #board {
    width: var(--board); height: var(--board);
    background: var(--panel);
    border-radius: 14px;
    position: relative;
    touch-action: none;
    box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1px #2c335e;
  }
  .slot, .tile {
    position: absolute;
    width: var(--cell); height: var(--cell);
    left: var(--gap); top: var(--gap);
    border-radius: 10px;
  }
  .slot { background: var(--slot); }
  .tile {
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    transform: translate(calc(var(--c) * (var(--cell) + var(--gap))), calc(var(--r) * (var(--cell) + var(--gap))));
    transition: transform 110ms ease-in-out;
    z-index: 2;
  }
  .tile .in {
    width: 100%; height: 100%; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .tile.new .in { animation: appear 160ms ease-out; }
  .tile.pop .in { animation: pop 180ms ease-out; }
  .tile.gone { z-index: 1; }
  @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
  #overlay {
    position: absolute; inset: 0; border-radius: 14px;
    background: rgba(13,16,33,.82);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    z-index: 10; text-align: center;
  }
  #overlay.show { display: flex; animation: fade .3s; }
  @keyframes fade { from { opacity: 0; } }
  #overlay h2 { font-size: 34px; }
  #overlay p { color: var(--muted); }
  #overlay div { display: flex; gap: 10px; }
  footer { margin-top: 16px; color: var(--muted); font-size: 13px; text-align: center; width: var(--board); }
</style>
</head>
<body>
<header>
  <h1>СЛИЯНИЕ</h1>
  <div class="scores">
    <div class="score" id="scoreBox"><small>Очки</small><b id="score">0</b></div>
    <div class="score"><small>Рекорд</small><b id="best">0</b></div>
  </div>
</header>
<div class="controls">
  <span>Собери плитку <b style="color:#fff">2048</b></span>
  <div>
    <button id="undo" disabled>↶ Отмена</button>
    <button id="restart">Новая игра</button>
  </div>
</div>
<div id="board">
  <div id="overlay">
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <div>
      <button id="ovContinue">Продолжить</button>
      <button id="ovRestart">Ещё раз</button>
    </div>
  </div>
</div>
<footer>Стрелки / WASD или свайп. Одинаковые плитки при столкновении сливаются.</footer>

<script>
(() => {
  const N = 4, GOAL = 2048;
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const scoreBox = document.getElementById('scoreBox');
  const undoBtn = document.getElementById('undo');
  const overlay = document.getElementById('overlay');

  let tiles = [];      // {id, v, r, c, el}
  let score = 0, best = +localStorage.getItem('merge-best') || 0;
  let won = false, keepPlaying = false, over = false, busy = false;
  let history = null, nextId = 1;

  for (let i = 0; i < N * N; i++) {
    const s = document.createElement('div');
    s.className = 'slot';
    s.style.transform = `translate(calc(${i % N} * (var(--cell) + var(--gap))), calc(${Math.floor(i / N)} * (var(--cell) + var(--gap))))`;
    board.appendChild(s);
  }

  function colorFor(v) {
    const k = Math.log2(v);                 // 1..11+
    const hue = (190 + (k - 1) * 28) % 360; // cyan → violet → pink → orange...
    const light = Math.max(38, 62 - k * 2);
    return {
      bg: `linear-gradient(135deg, hsl(${hue},85%,${light}%), hsl(${(hue + 25) % 360},80%,${light - 10}%))`,
      glow: k >= 7 ? `0 0 ${(k - 6) * 6}px hsl(${hue},90%,60%)` : 'none',
    };
  }

  function paint(t) {
    const { bg, glow } = colorFor(t.v);
    const inner = t.el.firstChild;
    inner.style.background = bg;
    inner.style.boxShadow = glow;
    inner.textContent = t.v;
    const digits = String(t.v).length;
    inner.style.fontSize = `calc(var(--cell) * ${digits <= 2 ? 0.45 : digits === 3 ? 0.36 : 0.28})`;
    inner.style.color = t.v <= 4 ? '#0d1021' : '#fff';
  }

  function place(t) {
    t.el.style.setProperty('--r', t.r);
    t.el.style.setProperty('--c', t.c);
  }

  function makeTile(v, r, c, isNew = true) {
    const el = document.createElement('div');
    el.className = 'tile' + (isNew ? ' new' : '');
    el.appendChild(document.createElement('div')).className = 'in';
    const t = { id: nextId++, v, r, c, el };
    place(t); paint(t);
    board.appendChild(el);
    tiles.push(t);
    return t;
  }

  function gridOf() {
    const g = Array.from({ length: N }, () => Array(N).fill(null));
    tiles.forEach(t => g[t.r][t.c] = t);
    return g;
  }

  function addRandom() {
    const g = gridOf(), empty = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!g[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    makeTile(Math.random() < 0.9 ? 2 : 4, r, c);
  }

  function setScore(s, gained = 0) {
    score = s;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('merge-best', best);
    }
    bestEl.textContent = best;
    if (gained > 0) {
      const p = document.createElement('span');
      p.className = 'plus'; p.textContent = '+' + gained;
      scoreBox.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  }

  function snapshot() {
    return { tiles: tiles.map(t => [t.v, t.r, t.c]), score, won, keepPlaying };
  }

  function restore(s) {
    tiles.forEach(t => t.el.remove());
    tiles = [];
    s.tiles.forEach(([v, r, c]) => makeTile(v, r, c, false));
    won = s.won; keepPlaying = s.keepPlaying; over = false;
    setScore(s.score);
    hideOverlay();
  }

  // dir: 0 left, 1 right, 2 up, 3 down
  function coord(dir, line, pos) {
    switch (dir) {
      case 0: return [line, pos];
      case 1: return [line, N - 1 - pos];
      case 2: return [pos, line];
      case 3: return [N - 1 - pos, line];
    }
  }

  function move(dir) {
    if (busy || over || overlay.classList.contains('show')) return;
    const before = snapshot();
    const g = gridOf();
    let moved = false, gained = 0;
    const absorbed = [], merged = new Set();

    for (let line = 0; line < N; line++) {
      const row = [];
      for (let p = 0; p < N; p++) {
        const [r, c] = coord(dir, line, p);
        if (g[r][c]) row.push(g[r][c]);
      }
      let pos = 0, last = null;
      for (const t of row) {
        if (last && last.v === t.v && !merged.has(last)) {
          last.v *= 2;
          gained += last.v;
          merged.add(last);
          t.r = last.r; t.c = last.c;
          absorbed.push(t);
          moved = true;
        } else {
          const [r, c] = coord(dir, line, pos++);
          if (t.r !== r || t.c !== c) moved = true;
          t.r = r; t.c = c;
          last = t;
        }
      }
    }
    if (!moved) return;

    history = before;
    undoBtn.disabled = false;
    busy = true;

    tiles.forEach(t => { t.el.classList.remove('new', 'pop'); place(t); });
    absorbed.forEach(t => t.el.classList.add('gone'));
    tiles = tiles.filter(t => !absorbed.includes(t));

    setTimeout(() => {
      absorbed.forEach(t => t.el.remove());
      merged.forEach(t => {
        paint(t);
        void t.el.offsetWidth;
        t.el.classList.add('pop');
        if (t.v >= GOAL && !won) won = true;
      });
      setScore(score + gained, gained);
      addRandom();
      busy = false;

      if (won && !keepPlaying) {
        showOverlay('Победа! 🎉', `Ты собрал ${GOAL}. Счёт: ${score}`, true);
      } else if (!canMove()) {
        over = true;
        showOverlay('Ходов нет', `Итоговый счёт: ${score}`, false);
      }
    }, 115);
  }

  function canMove() {
    const g = gridOf();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = g[r][c];
      if (!t) return true;
      if (c < N - 1 && g[r][c + 1] && g[r][c + 1].v === t.v) return true;
      if (r < N - 1 && g[r + 1][c] && g[r + 1][c].v === t.v) return true;
    }
    return false;
  }

  function showOverlay(title, text, canContinue) {
    document.getElementById('ovTitle').textContent = title;
    document.getElementById('ovText').textContent = text;
    document.getElementById('ovContinue').style.display = canContinue ? '' : 'none';
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  function newGame() {
    tiles.forEach(t => t.el.remove());
    tiles = [];
    won = keepPlaying = over = busy = false;
    history = null; undoBtn.disabled = true;
    setScore(0);
    hideOverlay();
    addRandom(); addRandom();
  }

  // Управление
  const keys = {
    ArrowLeft: 0, ArrowRight: 1, ArrowUp: 2, ArrowDown: 3,
    a: 0, d: 1, w: 2, s: 3, ф: 0, в: 1, ц: 2, ы: 3,
  };
  document.addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k in keys) { e.preventDefault(); move(keys[k]); }
    else if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undoBtn.click(); }
  });

  let sx = 0, sy = 0, tracking = false;
  board.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; tracking = true; });
  board.addEventListener('pointerup', e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 0);
    else move(dy > 0 ? 3 : 2);
  });
  board.addEventListener('pointercancel', () => tracking = false);

  undoBtn.addEventListener('click', () => {
    if (!history || busy) return;
    restore(history);
    history = null;
    undoBtn.disabled = true;
  });
  document.getElementById('restart').addEventListener('click', newGame);
  document.getElementById('ovRestart').addEventListener('click', newGame);
  document.getElementById('ovContinue').addEventListener('click', () => { keepPlaying = true; hideOverlay(); });

  newGame();
})();
</script>
</body>
</html>
